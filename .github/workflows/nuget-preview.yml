name: Publish Preview NuGet

on:
  workflow_dispatch:
    inputs:
      preview_suffix:
        description: "Preview suffix, for example alpha, beta, rc, dev"
        required: true
        type: string
        default: "preview"
      publish_to_nuget:
        description: "Push preview packages to NuGet.org"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  SOLUTION_FILE: MiKiNuo.Mvi.slnx
  PACKAGE_OUTPUT: artifacts/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  preview-pack:
    name: Preview Pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve preview version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $suffix = "${{ inputs.preview_suffix }}"
          $version = "0.0.0-$suffix.$date.${{ github.run_number }}"
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PUBLISH_TO_NUGET=${{ inputs.publish_to_nuget }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PACKAGE_VERSION=$version"

      - name: Build, test, pack and verify consumers
        shell: pwsh
        run: ./scripts/pack-local.ps1 -Version "${{ env.PACKAGE_VERSION }}" -NonGraphical

      - name: Upload preview package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-nuget-packages-${{ env.PACKAGE_VERSION }}
          path: |
            ${{ env.PACKAGE_OUTPUT }}/${{ env.PACKAGE_VERSION }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/${{ env.PACKAGE_VERSION }}/evidence/**
          if-no-files-found: error

      - name: Publish preview packages to NuGet.org
        if: env.PUBLISH_TO_NUGET == 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.NUGET_API_KEY }}")) {
            throw "Missing repository secret: NUGET_API_KEY"
          }

          Get-ChildItem -LiteralPath "${{ env.PACKAGE_OUTPUT }}/${{ env.PACKAGE_VERSION }}" -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ secrets.NUGET_API_KEY }}" `
              --source "${{ env.NUGET_SOURCE }}" `
              --skip-duplicate
          }
