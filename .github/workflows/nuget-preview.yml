name: Publish Preview NuGet

on:
  workflow_dispatch:
    inputs:
      preview_suffix:
        description: "Preview suffix, for example alpha, beta, rc, dev"
        required: true
        type: string
        default: "preview"
      publish_to_nuget:
        description: "Push preview packages to NuGet.org"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  preview-pack:
    name: Preview Pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve preview version
        shell: pwsh
        env:
          PREVIEW_SUFFIX: ${{ inputs.preview_suffix }}
          INPUT_PUBLISH_TO_NUGET: ${{ inputs.publish_to_nuget }}
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $version = "0.0.0-$($env:PREVIEW_SUFFIX).$date.$($env:GITHUB_RUN_NUMBER)"
          python tools/release.py version --version "$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PUBLISH_TO_NUGET=$env:INPUT_PUBLISH_TO_NUGET" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build, test and pack preview packages
        shell: pwsh
        run: python tools/release.py pack --version "$env:PACKAGE_VERSION"

      - name: Upload preview package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-nuget-packages-${{ env.PACKAGE_VERSION }}
          path: artifacts/packages/${{ env.PACKAGE_VERSION }}/
          if-no-files-found: error

      - name: Publish preview packages to NuGet.org
        if: env.PUBLISH_TO_NUGET == 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: python tools/release.py publish --version "$env:PACKAGE_VERSION"

      - name: Upload preview failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-preview-logs-${{ github.run_id }}
          path: |
            artifacts/release/${{ env.PACKAGE_VERSION }}/
            artifacts/publish/${{ env.PACKAGE_VERSION }}/
          if-no-files-found: ignore
