name: CI

on:
  push:
    branches:
      - main
      - develop
      - codex/mvi-v2
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop
      - codex/mvi-v2
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  SOLUTION_FILE: MiKiNuo.Mvi.slnx

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build, test and verify three-package consumers
        shell: pwsh
        run: ./scripts/pack-local.ps1 -Version "2.0.0-ci.${{ github.run_number }}" -NonGraphical

      - name: Upload verified package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-consumers
          path: artifacts/packages/*/evidence/**
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore
