name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version, for example 0.1.2"
        required: true
        type: string
      publish_to_nuget:
        description: "Push packages to NuGet.org"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  PACKAGE_OUTPUT: artifacts/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  pack-and-publish:
    name: Pack and Publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $publish = "true"
          }
          else {
            $version = "${{ inputs.version }}"
            $publish = "${{ inputs.publish_to_nuget }}"
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package version cannot be empty."
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PUBLISH_TO_NUGET=$publish" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "PACKAGE_VERSION=$version"
          Write-Host "PUBLISH_TO_NUGET=$publish"

      - name: Build, test, pack and verify consumers
        shell: pwsh
        run: ./scripts/pack-local.ps1 -Version "${{ env.PACKAGE_VERSION }}" -NonGraphical

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ env.PACKAGE_VERSION }}
          path: |
            ${{ env.PACKAGE_OUTPUT }}/${{ env.PACKAGE_VERSION }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/${{ env.PACKAGE_VERSION }}/evidence/**
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: env.PUBLISH_TO_NUGET == 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.NUGET_API_KEY }}")) {
            throw "Missing repository secret: NUGET_API_KEY"
          }

          Get-ChildItem -LiteralPath "${{ env.PACKAGE_OUTPUT }}/${{ env.PACKAGE_VERSION }}" -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ secrets.NUGET_API_KEY }}" `
              --source "${{ env.NUGET_SOURCE }}" `
              --skip-duplicate
          }
