name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version, for example 2.0.0 or 2.0.0-preview.4"
        required: true
        type: string
      publish_to_nuget:
        description: "Push packages to NuGet.org"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  pack-and-publish:
    name: Pack and Publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        shell: pwsh
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_TO_NUGET: ${{ inputs.publish_to_nuget }}
        run: |
          if ($env:RELEASE_EVENT_NAME -eq "push") {
            $version = $env:RELEASE_REF_NAME -creplace '^v', ''
            $publish = "true"
          }
          else {
            $version = $env:INPUT_VERSION
            $publish = $env:INPUT_PUBLISH_TO_NUGET
          }

          python tools/release.py version --version "$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PUBLISH_TO_NUGET=$publish" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build, test and pack NuGet packages
        shell: pwsh
        run: python tools/release.py pack --version "$env:PACKAGE_VERSION"

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ env.PACKAGE_VERSION }}
          path: artifacts/packages/${{ env.PACKAGE_VERSION }}/
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: env.PUBLISH_TO_NUGET == 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: python tools/release.py publish --version "$env:PACKAGE_VERSION"

      - name: Upload release failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-logs-${{ github.run_id }}
          path: |
            artifacts/release/${{ env.PACKAGE_VERSION }}/
            artifacts/publish/${{ env.PACKAGE_VERSION }}/
          if-no-files-found: ignore
